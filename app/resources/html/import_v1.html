<!-- 导入演示页面，用于上传文档并观察导入状态。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件导入服务</title>
    <style>
        /* ===== 设计变量 ===== */
        :root {
            --ink: #1f2a3d;
            --ink-soft: #5c6b80;
            --ink-faint: #8a97a8;
            --line: #e4eaf2;
            --card: #ffffff;
            --accent: #3b82f6;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-card: 0 1px 2px rgba(23, 43, 77, .05), 0 16px 40px -16px rgba(23, 43, 77, .18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(1100px 480px at 88% -12%, rgba(59, 130, 246, .12), transparent 60%),
                radial-gradient(900px 420px at -8% 108%, rgba(99, 102, 241, .10), transparent 55%),
                linear-gradient(165deg, #f2f6fb 0%, #e8eef7 100%);
            margin: 0;
            padding: 48px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: var(--card);
            padding: 40px 40px 32px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, .8);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        /* 顶部渐变装饰条 */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #38bdf8, #3b82f6 40%, #8b5cf6 70%, #f59e0b);
        }

        h1 {
            margin: 6px 0 28px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: .3px;
            color: var(--ink);
        }

        /* 上传区域：底色保持纯色，兼容拖拽时的内联高亮 (#ecf6fd) */
        .upload-area {
            border: 1.5px dashed #b9c9e2;
            border-radius: var(--radius-md);
            background-color: #f8fbff;
            padding: 44px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease, transform .25s ease;
            margin-bottom: 26px;
        }
        .upload-area:hover {
            border-color: #6d9ee8;
            box-shadow: 0 10px 26px -14px rgba(59, 130, 246, .45);
            transform: translateY(-1px);
        }
        .upload-icon {
            width: 64px;
            height: 64px;
            line-height: 64px;
            font-size: 28px;
            margin: 0 auto 12px;
            border-radius: 18px;
            background: linear-gradient(135deg, #e4efff, #d3e5ff);
            box-shadow: inset 0 0 0 1px rgba(59, 130, 246, .18), 0 8px 16px -10px rgba(59, 130, 246, .5);
        }
        .upload-area p {
            margin: 0;
            font-size: 14px;
            color: var(--ink-soft);
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 18px -8px rgba(37, 99, 235, .6);
            transition: filter .2s, transform .2s, box-shadow .2s;
        }
        .btn:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }
        .btn:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .file-list {
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-item {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color .25s, box-shadow .25s;
            animation: file-in .35s ease both;
        }
        .file-item:hover {
            border-color: #c7d7ef;
            box-shadow: 0 12px 28px -18px rgba(23, 43, 77, .35);
        }
        @keyframes file-in {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            margin-right: 20px;
        }
        .file-name {
            font-weight: 600;
            font-size: 14.5px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size {
            font-size: 12px;
            color: var(--ink-faint);
            margin-top: 4px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            min-width: 88px;
            text-align: center;
            letter-spacing: .5px;
            flex-shrink: 0;
            box-shadow: 0 6px 14px -6px rgba(23, 43, 77, .45);
        }
        .status-uploading { background: linear-gradient(135deg, #f59e0b, #f97316); }
        .status-processing {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            animation: badge-glow 1.8s ease-in-out infinite;
        }
        .status-completed { background: linear-gradient(135deg, #34d399, #059669); }
        .status-error { background: linear-gradient(135deg, #f87171, #dc2626); }
        @keyframes badge-glow {
            0%, 100% { box-shadow: 0 6px 14px -6px rgba(59, 130, 246, .55); }
            50%      { box-shadow: 0 6px 20px -4px rgba(99, 102, 241, .75); }
        }

        /* 进度条（条体颜色由脚本内联设置：进行中橙 / 完成蓝） */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: #edf1f7;
            border-radius: 999px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
            box-shadow: inset 0 1px 2px rgba(23, 43, 77, .08);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width .4s ease, background-color .4s ease;
        }

        /* 任务日志（可展开/收起） */
        .log-details {
            margin-top: 10px;
            font-size: 12px;
            color: var(--ink-soft);
            background: #f7f9fc;
            border: 1px solid #edf1f7;
            border-radius: 10px;
            padding: 8px 12px;
        }
        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: #5a6b84;
            font-weight: 600;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: color .2s;
        }
        .log-details summary:hover { color: var(--accent); }
        .log-details summary::-webkit-details-marker { display: none; }
        .log-details summary::before {
            content: "▸";
            flex-shrink: 0;
            transition: transform .2s ease;
        }
        .log-details[open] summary::before { transform: rotate(90deg); }
        .log-list {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
        }
        .log-list li {
            margin: 4px 0;
            line-height: 1.5;
            padding-left: 14px;
            position: relative;
            color: #4c5b72;
        }
        .log-list li::before {
            content: "";
            position: absolute;
            left: 1px;
            top: .55em;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #8fb3e8;
        }

        /* 小屏适配 */
        @media (max-width: 560px) {
            body { padding: 24px 12px; }
            .container { padding: 28px 18px 22px; }
            .file-item { flex-direction: column; align-items: stretch; gap: 10px; }
            .status-badge { align-self: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 知识库文件导入</h1>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">☁️</div>
        <p>点击或拖拽文件到此处 (PDF/MD)</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
    </div>

    <div id="fileList" class="file-list">
        <!-- 文件列表将在这里生成 -->
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    
    // 默认走导入服务同源地址；如你把页面单独打开（file://），回退到导入服务默认端口。
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db'; // 蓝色
        } else {
            bar.style.backgroundColor = '#f39c12'; // 橘红色
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(2)} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');
        const logDetails = itemEl.querySelector('.log-details');
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Upload failed');
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function normalizeDoneLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“已完成”
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“正在进行.../处理中...”
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // 更新 summary（即使收起也能看到进度）
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        // 清空并重建列表
        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        // 如果没有任何日志，默认收起；否则保持用户选择
        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`);
                const data = await res.json();

                // 渲染日志（done/running）
                renderLogs(itemEl, data.done_list, data.running_list);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    // 保持处理中状态
                    statusBadge.textContent = '处理中...';
                    // 确保进度为30%
                     updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) {
                console.error('Polling error', e);
            }
        }, 2000); // 每2秒轮询一次
    }
</script>

</body>
</html>
